<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa Brisa Rush — an open-world crime game</title>
  <style>
    html, body { margin: 0; padding: 0; background: #101018; height: 100%; overflow: hidden; }
    #wrap { display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { width: min(100vw, 160vh); height: min(100vh, 62.5vw); background: #1c2a5e; image-rendering: auto; }
    #demo-report { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
  </div>
  <div id="demo-report"></div>
  <script type="module">
    import { startGame } from './js/engine.js';
    window.__game = startGame(document.getElementById('game'));
  </script>
</body>
</html>
